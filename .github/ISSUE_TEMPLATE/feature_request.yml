name: Feature request
description: Propose a new feature, strategy, engine, or improvement.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing an idea. The more you can frame this as a
        problem first and a solution second, the easier it is to evaluate.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Who is affected, when, and what does it cost them today?
      placeholder: "When running multi-symbol backtests, there's no way to compare per-symbol P&L without exporting to a spreadsheet ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would it work end-to-end? Mock UI / API shapes welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you think about? Why is the proposed one better?
    validations:
      required: false

  - type: dropdown
    id: component
    attributes:
      label: Which component?
      multiple: true
      options:
        - Frontend (Vue/Vite)
        - Backend API
        - Backtest engine
        - Live trading
        - Graph Nexus
        - Chatbot
        - Discord bot
        - Credential / auth
        - New strategy module
        - Documentation
        - Install / DevOps
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmations
      options:
        - label: I have searched existing issues and discussions and this isn't a duplicate
          required: true
        - label: I am willing to help implement this (optional, but appreciated)
          required: false
