name: intellistock_mobile
description: "IntelliStock mobile — native iOS/Android client for the IntelliStock trading platform."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Networking
  dio: ^5.7.0

  # Models / serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Routing
  go_router: ^14.6.2

  # Charts
  syncfusion_flutter_charts: ^33.2.12

  # Markdown (chatbot)
  flutter_markdown: ^0.7.5

  # Secure storage / biometrics
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0

  # iOS widgets bridge
  home_widget: ^0.7.0

  # Utilities
  intl: ^0.20.1
  google_fonts: ^6.2.1
  package_info_plus: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.1
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  image_path: "assets/app_logo.png"
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#04040C"

flutter:
  uses-material-design: true
  assets:
    - assets/
